name: Build Blitztext APK

on:
  push:
    branches: [main, master]
    paths:
      - "android-app/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Ensure stable signing keystore
        working-directory: android-app
        run: |
          if [ ! -f app/blitztext.jks ]; then
            keytool -genkeypair -v -keystore app/blitztext.jks \
              -storepass blitztext -keypass blitztext -alias blitztext \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Blitztext, O=avf, C=CH"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/blitztext.jks
            git commit -m "CI: add stable signing keystore [skip ci]"
            git push
          fi

      - name: Build debug APK
        working-directory: android-app
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: blitztext-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to 'latest' release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Blitztext (latest)
          files: android-app/app/build/outputs/apk/debug/app-debug.apk
